name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.27 is the minimum version declared in both go.mod files.
        go-version: ["1.27", "stable"]
        # The repository holds two modules: go.xchunk.org/cache at the root
        # and go.xchunk.org/cache/v2 in v2/. Each is tested on its own.
        module: [".", "v2"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  staticcheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "v2"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
